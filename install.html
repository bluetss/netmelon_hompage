<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Naepopquiz Install Redirect</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://naepopquiz.com/">
  <meta http-equiv="Cache-Control" content="no-store">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Roboto", sans-serif;
      background: #faf7f1;
      color: #17362f;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
      padding: 0 24px;
    }
  </style>
</head>
<body>
  <h1>내팝퀴즈 설치 페이지로 이동하는 중입니다.</h1>
  <script>
    const IOS_URL = "https://apple.co/4ez9nji";
    const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.netmelon.naepopquiz";
    const WEB_FALLBACK = "https://naepopquiz.com/";
    const ua = navigator.userAgent.toLowerCase();

    if (ua.includes("iphone") || ua.includes("ipad")) {
      location.replace(IOS_URL);
    } else if (ua.includes("android")) {
      location.replace(ANDROID_URL);
    } else {
      location.replace(WEB_FALLBACK);
    }
  </script>
</body>
</html>

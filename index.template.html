  <script>
    (() => {
      const header = document.querySelector(".site-header");
      const menuToggle = document.querySelector(".menu-toggle");
      const nav = document.querySelector(".site-nav");
      const downloadToggle = document.querySelector(".download-toggle");
      const downloadDropdown = document.querySelector(".download-dropdown");
      const appPanel = document.querySelector("#naepopquiz-app");
      const appShotcase = document.querySelector(".app-shotcase");
      const appShotTrack = document.querySelector(".app-shot-track");
      if (!header || !menuToggle || !nav) return;
      let shotRafId = null;

      const closeMenu = () => {
        header.classList.remove("menu-open");
        menuToggle.setAttribute("aria-expanded", "false");
      };

      const closeDownloadMenu = () => {
        header.classList.remove("download-open");
        if (downloadToggle) downloadToggle.setAttribute("aria-expanded", "false");
      };

      const closeAllMenus = () => {
        closeMenu();
        closeDownloadMenu();
      };

      const updateAppShots = () => {
        if (!appPanel || !appShotcase || !appShotTrack) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          appShotTrack.style.setProperty("--shots-track-x", "0px");
          return;
        }
        if (!window.matchMedia("(max-width: 920px)").matches) {
          appShotTrack.style.setProperty("--shots-track-x", "0px");
          return;
        }

        const rect = appPanel.getBoundingClientRect();
        const vh = window.innerHeight || 1;
        const startTop = vh * 0.95;
        const stickyTop = parseFloat(window.getComputedStyle(document.documentElement).getPropertyValue("--header-offset")) || 76;
        const holdUntilTop = (startTop + stickyTop) / 2;
        const firstShot = appShotTrack.querySelector(".shot-1");
        const shotWidth = firstShot ? firstShot.getBoundingClientRect().width : 0;
        const gap = parseFloat(window.getComputedStyle(appShotTrack).columnGap || window.getComputedStyle(appShotTrack).gap || "0");
        if (shotWidth <= 0) {
          appShotTrack.style.setProperty("--shots-track-x", "0px");
          return;
        }
        const centerOffset = (appShotcase.clientWidth - shotWidth) / 2;
        const shiftDistance = shotWidth + gap;
        if (shiftDistance <= 1) {
          appShotTrack.style.setProperty("--shots-track-x", `${centerOffset.toFixed(1)}px`);
          return;
        }
        const slideDenominator = Math.max(1, holdUntilTop - stickyTop);
        const slideProgress = rect.top >= holdUntilTop
          ? 0
          : Math.max(0, Math.min(1, (holdUntilTop - rect.top) / slideDenominator));
        const shotsTrackX = centerOffset - shiftDistance * slideProgress;
        appShotTrack.style.setProperty("--shots-track-x", `${shotsTrackX.toFixed(1)}px`);
      };

      const requestShotUpdate = () => {
        if (shotRafId !== null) return;
        shotRafId = window.requestAnimationFrame(() => {
          shotRafId = null;
          updateAppShots();
        });
      };

      menuToggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const isOpen = !header.classList.contains("menu-open");
        closeDownloadMenu();
        header.classList.toggle("menu-open", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });

      if (downloadToggle) {
        downloadToggle.addEventListener("click", (event) => {
          event.stopPropagation();
          const isOpen = !header.classList.contains("download-open");
          closeMenu();
          header.classList.toggle("download-open", isOpen);
          downloadToggle.setAttribute("aria-expanded", String(isOpen));
        });
      }

      nav.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeAllMenus);
      });

      if (downloadDropdown) {
        downloadDropdown.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", closeDownloadMenu);
        });
      }

      document.addEventListener("click", (event) => {
        if (!header.contains(event.target)) closeAllMenus();
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 920) closeAllMenus();
        requestShotUpdate();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeAllMenus();
      });

      window.addEventListener("scroll", requestShotUpdate, { passive: true });
      requestShotUpdate();
    })();
  </script>

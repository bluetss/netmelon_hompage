<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="canonical" href="https://naepopquiz.com/data-deletion.html" />
  <title id="data-deletion-title">네트멜론 - 계정 · 데이터 삭제</title>
  <style>
    :root {
      --primary:             var(--npq-color-primary);
      --on-primary:          var(--npq-color-on-primary);
      --primary-container:   var(--npq-color-primary-container);
      --on-primary-container:var(--npq-color-on-primary-container);
      --secondary:           var(--npq-color-secondary);
      --on-secondary:        var(--npq-color-on-secondary);
      --secondary-container: var(--npq-color-secondary-container);
      --on-secondary-container:var(--npq-color-on-secondary-container);
      --surface:             var(--npq-color-surface);
      --surface-low:         #FFFDE8;
      --surface-container:   var(--npq-color-surface-container);
      --surface-container-low:var(--npq-color-surface-container-low);
      --on-surface:          var(--npq-color-on-surface);
      --on-surface-variant:  var(--npq-color-on-surface-variant);
      --outline:             var(--npq-color-outline);
      --elev1: 0 1px 3px rgba(220,200,0,.09),0 1px 2px rgba(220,200,0,.13);
      --elev2: 0 2px 6px rgba(220,200,0,.13),0 1px 2px rgba(220,200,0,.17);
    }
    html, body {
      margin:0; padding:0;
      font-family:var(--npq-font-family-base);
      background: var(--surface);
      color: var(--on-surface);
    }
    body { padding-top: 80px; }
    h1, h2 { margin: 0; }
    h1 { font-size: var(--npq-type-headline-medium-font-size); line-height: var(--npq-type-headline-medium-line-height); font-weight: var(--npq-weight-medium); letter-spacing:             var(--npq-type-headline-medium-letter-spacing); }
    h2 { font-size: var(--npq-type-headline-small-font-size); line-height: var(--npq-type-headline-small-line-height); font-weight: var(--npq-weight-medium); color: var(--on-primary); letter-spacing:             var(--npq-type-headline-small-letter-spacing); }
    p, a { font-size: var(--npq-type-title-small-font-size); line-height: var(--npq-type-title-small-line-height); color: var(--on-surface-variant); text-decoration: none; letter-spacing:             var(--npq-type-title-small-letter-spacing); }

    header {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 16px 0;
      background: color-mix(in srgb, var(--npq-color-secondary-container) 60%, transparent);
      backdrop-filter: blur(8px);
      box-shadow: var(--elev2);
      transition: background .3s;
      z-index: 100;
    }
    header.scrolled { background: var(--primary) !important; }
    header .container {
      max-width: 1200px; margin: auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    nav a {
      margin-left: 8px; margin-right: 16px;
      color: var(--on-primary);
      font-weight: var(--npq-weight-medium);
      transition: color .2s;
    }
    nav a:hover { color: var(--on-surface); }

    .policy-container {
      display: flex;
      max-width: 1200px;
      margin: 100px auto 60px;
      gap: 32px;
      padding: 0 24px;
    }
    .policy-content {
      flex: 1;
      background: var(--surface);
      border-radius: 8px;
      padding: 32px;
      box-shadow: var(--elev1);
    }
    .policy-content h2, .policy-content h3 {
      color: var(--on-primary);
      margin-top: 24px;
    }
    .policy-content p, .policy-content li {
      line-height: 1.6;
      margin-bottom: 16px;
    }

    footer {
      background: var(--on-surface);
      color: var(--surface);
      padding: 40px 0;
    }
    .footer-info { text-align: center; font-size: var(--npq-type-title-small-font-size); line-height:             var(--npq-type-title-small-line-height); letter-spacing:             var(--npq-type-title-small-letter-spacing); }
  </style>
  <link rel="stylesheet" href="/styles/site-shell.css">
</head>
<body>
  <header id="site-header">
    <div class="container">
      <h1 id="company-name">네트멜론</h1>
      <nav>
        <a href="#" id="home-link">HOME</a>
      </nav>
    </div>
  </header>

  <div class="policy-container">
    <article class="policy-content" id="policy-content">로딩 중...</article>
  </div>

  <footer>
    <div class="container">
      <div class="footer-info">© 2025 Netmelon. All rights reserved.</div>
    </div>
  </footer>

  <script>
    async function fetchJsonData(url) { const res = await fetch(url); return res.json(); }
    let dataDeletionPolicies, translations;
    const urlParams = new URLSearchParams(window.location.search);
    let currentLang = urlParams.get('lang') === 'en' ? 'en' : 'ko';

    document.addEventListener('DOMContentLoaded', async () => {
      dataDeletionPolicies = await fetchJsonData('data-deletion.json');
      translations = await fetchJsonData('translations.json');
      applyLangTexts(currentLang);
      renderDataDeletion(currentLang);
      window.addEventListener('scroll', () => {
        document.getElementById('site-header').classList.toggle('scrolled', window.scrollY > 50);
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      const homeLink = document.getElementById('home-link');
      if (homeLink) {
        homeLink.addEventListener('click', function(e) {
          e.preventDefault();
	          window.location.href = currentLang === 'en' ? '/en/' : '/';
        });
      }
    });

    function switchDataDeletionLang(lang) {
      currentLang = lang;
      applyLangTexts(lang);
      renderDataDeletion(lang);
    }

    function applyLangTexts(lang) {
      if(translations && translations[lang]) {
        document.title = translations[lang]['data-deletion-title'];
        document.getElementById('data-deletion-title').innerText = translations[lang]['data-deletion-title'];
        document.getElementById('company-name').innerText = translations[lang]['company-name'];
      }
      document.documentElement.lang = lang;
    }

    function renderDataDeletion(lang) {
      const html = dataDeletionPolicies[lang]?.content || '<p>내용이 없습니다.</p>';
      document.getElementById('policy-content').innerHTML = html;
      document.documentElement.lang = lang === 'en' ? 'en' : 'ko';
    }
  </script>
</body>
</html>

name: fast-ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'bluetss'
    runs-on: [self-hosted, linux, x64, npq-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject credential paths
        run: bash tools/verify_no_secrets.sh
      - name: Scan current tree without exposing values
        run: >-
          gitleaks dir .
          --config=.gitleaks.toml
          --gitleaks-ignore-path=.gitleaksignore
          --redact
          --no-banner
      - name: Reject whitespace drift
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Validate static release files
        run: |
          test -s index.html
          test -s privacy.html
          test -s terms.html
          python3 -m json.tool privacy.json >/dev/null
          python3 -m json.tool terms_of_service.json >/dev/null
          python3 -m json.tool data-deletion.json >/dev/null
